<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Dark Pattern Watch</title>
<style>
  :root {
    --bg: #0f1117; --card: #171a22; --card2: #1e222c; --line: rgba(255,255,255,.08);
    --text: #e6e8ee; --muted: #8b93a3;
    --visits: #38bdf8; --clicks: #a78bfa;
    --bad: #fb7185; --warn: #fb923c; --good: #34d399; --flat: #94a3b8; --hot: #fbbf24;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; width: 380px; margin: 0; padding: 14px;
         background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .2px; }
  .domain { font-size: 12px; color: var(--muted); margin: 2px 0 10px; word-break: break-all; }

  .chip { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
  .chip.bad  { color: var(--bad);  background: rgba(251,113,133,.14); }
  .chip.good { color: var(--good); background: rgba(52,211,153,.14); }
  .chip.flat { color: var(--flat); background: rgba(148,163,184,.14); }
  .chip.info { color: var(--visits); background: rgba(56,189,248,.14); }

  .tabs { display: flex; gap: 4px; background: var(--card); padding: 3px; border-radius: 8px; margin-bottom: 10px; }
  .tab { flex: 1; background: transparent; color: var(--muted); border: 0; padding: 6px 0; border-radius: 6px;
         font-size: 12px; cursor: pointer; }
  .tab.active { background: var(--card2); color: var(--text); font-weight: 600; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  .tile { background: var(--card); border-radius: 8px; padding: 7px 8px; }
  .tile .v { font-size: 16px; font-weight: 700; }
  .tile .l { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .tile .v.bad { color: var(--bad); } .tile .v.good { color: var(--good); }

  .chart-box { background: var(--card); border-radius: 8px; padding: 6px 6px 4px; margin-bottom: 10px; }
  canvas { display: block; }
  .readout { font-size: 11px; color: var(--muted); padding: 2px 4px 2px; min-height: 16px;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend { font-size: 10px; color: var(--muted); padding: 0 4px 3px; }
  .legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--hot); margin-right: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 11.5px; background: var(--card);
          border-radius: 8px; overflow: hidden; }
  th { text-align: left; font-weight: 500; font-size: 10px; color: var(--muted); padding: 6px 8px;
       border-bottom: 1px solid var(--line); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: center; }
  td.clip { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .s-new     { color: var(--bad);  background: rgba(251,113,133,.15); }
  .s-rising  { color: var(--warn); background: rgba(251,146,60,.15); }
  .s-stable  { color: var(--flat); background: rgba(148,163,184,.15); }
  .s-falling, .s-gone { color: var(--good); background: rgba(52,211,153,.15); }
  .up { color: var(--bad); font-weight: 600; } .down { color: var(--good); font-weight: 600; }
  .note { font-size: 10.5px; color: var(--muted); margin: 6px 2px 0; }
  .empty { font-size: 12px; color: var(--muted); text-align: center; padding: 18px 8px; background: var(--card);
           border-radius: 8px; }

  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .footer span { font-size: 11px; color: var(--muted); }
  .clear { background: var(--card2); color: var(--text); border: 0; padding: 6px 10px; border-radius: 6px;
           font-size: 11px; cursor: pointer; }
  .clear:hover { background: #2a2f3c; }
</style>
</head>
<body>
  <header>
    <h1>Dark Pattern Watch</h1>
    <span class="chip info" id="verdict" hidden></span>
  </header>
  <div class="domain" id="domain">—</div>

  <div class="tabs">
    <button class="tab active" data-tab="visits">Across visits</button>
    <button class="tab" data-tab="clicks">Across clicks</button>
  </div>

  <section id="tab-visits">
    <div class="tiles" id="visitTiles"></div>
    <div class="chart-box" id="visitChartBox">
      <canvas id="visitChart"></canvas>
      <div class="readout" id="visitReadout"></div>
      <div class="legend"><i></i>score rose since previous visit</div>
    </div>
    <div id="visitTable"></div>
  </section>

  <section id="tab-clicks" hidden>
    <div class="tiles" id="clickTiles"></div>
    <div class="chart-box" id="clickChartBox">
      <canvas id="clickChart"></canvas>
      <div class="readout" id="clickReadout"></div>
      <div class="legend"><i></i>click that changed the page's patterns</div>
    </div>
    <div id="clickTable"></div>
  </section>

  <div class="footer">
    <span id="footerInfo"></span>
    <button class="clear" id="exportBtn" title="Download data for ALL sites as JSON">Export all data</button>
    <button class="clear" id="clearBtn">Clear history for this site</button>
  </div>

  <script src="analysis.js"></script>
  <script src="popup.js"></script>
</body>
</html>
